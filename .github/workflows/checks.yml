name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run extension
      - name: Generated direction script is current
        run: git diff --exit-code -- extension/direction.js
      - run: npm test
      - run: npm run release
